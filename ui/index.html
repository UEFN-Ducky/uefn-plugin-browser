<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Browser</title>
<style>
  :root {
    --bg: #101012;
    --toolbar-bg: #161619;
    --border: rgba(255, 255, 255, 0.08);
    --text: #d8d8dc;
    --text-dim: #9a9aa2;
    --accent: #f5c451;
    --input-bg: rgba(255, 255, 255, 0.05);
    --secure: #6dcea0;
    --insecure: #ffb4b4;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font: 12px/1.4 "Segoe UI", system-ui, sans-serif;
    overflow: hidden;
  }
  #app { display: flex; flex-direction: column; width: 100%; height: 100%; }
  #toolbar {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 5px 7px;
    background: var(--toolbar-bg);
    border-bottom: 1px solid var(--border);
    flex: 0 0 auto;
    position: relative;
    z-index: 5;
  }
  #toolbar button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 27px;
    height: 27px;
    border: none;
    border-radius: 6px;
    background: transparent;
    color: var(--text-dim);
    cursor: pointer;
    flex: 0 0 auto;
    padding: 0;
  }
  #toolbar button:hover:not(:disabled) { background: rgba(255, 255, 255, 0.07); color: var(--text); }
  #toolbar button:disabled { opacity: 0.32; cursor: default; }
  #url-wrap {
    position: relative;
    flex: 1 1 auto;
    min-width: 60px;
    display: flex;
    align-items: center;
    height: 27px;
    border-radius: 14px;
    border: 1px solid var(--border);
    background: var(--input-bg);
  }
  #url-wrap:focus-within { border-color: rgba(245, 196, 81, 0.45); }
  #url-wrap.is-secure { border-color: rgba(109, 206, 160, 0.35); }
  #url-wrap.is-insecure { border-color: rgba(255, 180, 180, 0.4); }
  #sec {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 100%;
    flex: 0 0 auto;
    color: var(--text-dim);
    border: none;
    background: transparent;
    padding: 0;
    cursor: default;
  }
  #sec.is-secure { color: var(--secure); }
  #sec.is-insecure { color: var(--insecure); cursor: help; }
  #url {
    flex: 1 1 auto;
    min-width: 0;
    height: 100%;
    padding: 0 10px 0 0;
    border: none;
    border-radius: 0 14px 14px 0;
    background: transparent;
    color: var(--text);
    font-size: 12px;
    outline: none;
  }
  /* Portaled under #app (not inside the 27px url-wrap) so it cannot clip/stack. */
  #suggest {
    display: none;
    position: absolute;
    left: 0;
    top: 0;
    width: 280px;
    max-height: 240px;
    overflow: auto;
    background: #1a1a1e;
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: 0 10px 28px rgba(0, 0, 0, 0.55);
    z-index: 300;
  }
  #suggest.is-open { display: block; }
  .suggest-item {
    display: flex;
    flex-direction: column;
    gap: 2px;
    width: 100%;
    padding: 8px 12px;
    border: none;
    background: transparent;
    color: var(--text);
    text-align: left;
    font: inherit;
    cursor: pointer;
  }
  .suggest-item:hover,
  .suggest-item.is-active {
    background: rgba(245, 196, 81, 0.12);
  }
  .suggest-title {
    font-size: 12px;
    font-weight: 600;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .suggest-url {
    font-size: 10px;
    color: var(--text-dim);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .suggest-empty {
    margin: 0;
    padding: 10px 12px;
    color: var(--text-dim);
    font-size: 11px;
  }
  #progress {
    height: 2px;
    flex: 0 0 auto;
    background: transparent;
    position: relative;
    overflow: hidden;
  }
  #progress.loading::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    animation: slide 1.1s linear infinite;
  }
  @keyframes slide {
    from { transform: translateX(-100%); }
    to { transform: translateX(100%); }
  }
  #content { flex: 1 1 auto; min-height: 0; position: relative; }
  #notice {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
    color: var(--text-dim);
    font-size: 13px;
    line-height: 1.5;
  }
  #notice.failed {
    color: #ffb4b4;
    background: rgba(255, 72, 72, 0.1);
    border: 1px solid rgba(255, 100, 100, 0.35);
    border-radius: 8px;
    margin: 12px;
    font-weight: 500;
  }
  #notice.hidden { display: none; }
  /* Chrome-sized padlock bubble — anchored under the lock, not a full-page modal */
  #site-info {
    display: none;
    position: absolute;
    top: 36px;
    left: 8px;
    width: min(320px, calc(100% - 16px));
    z-index: 200;
    max-height: min(420px, calc(100% - 48px));
    overflow: auto;
    background: #2b2b2f;
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 8px;
    box-shadow: 0 8px 28px rgba(0, 0, 0, 0.45);
    color: var(--text);
    font-size: 12px;
  }
  #site-info.is-open { display: block; }
  .si-head {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    padding: 12px 12px 10px;
  }
  .si-head-icon { flex-shrink: 0; margin-top: 1px; }
  .si-head-icon.is-secure { color: var(--secure); }
  .si-head-icon.is-insecure,
  .si-head-icon.is-cert_error { color: var(--insecure); }
  .si-head h2 { margin: 0 0 2px; font-size: 13px; font-weight: 600; }
  .si-head p { margin: 0; font-size: 11px; color: var(--text-dim); line-height: 1.35; }
  .si-close {
    margin-left: auto;
    border: none;
    background: transparent;
    color: var(--text-dim);
    font-size: 16px;
    cursor: pointer;
    line-height: 1;
    padding: 0 2px;
  }
  .si-section { padding: 8px 12px; border-top: 1px solid rgba(255,255,255,0.08); }
  .si-section h3 {
    margin: 0 0 6px;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text-dim);
  }
  .si-row {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    font-size: 12px;
    margin-bottom: 4px;
  }
  .si-row span { color: var(--text-dim); }
  .si-row strong { font-weight: 600; text-align: right; word-break: break-all; }
  .si-cookies { max-height: 88px; overflow: auto; }
  .si-cookie {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    font-size: 11px;
    padding: 3px 0;
  }
  .si-cookie code { color: var(--text); }
  .si-cookie em { color: var(--text-dim); font-style: normal; font-size: 10px; }
  .si-mono {
    margin: 4px 0 0;
    font-size: 10px;
    color: var(--text-dim);
    word-break: break-all;
    font-family: ui-monospace, Consolas, monospace;
  }
  .si-actions { display: flex; gap: 8px; padding: 8px 12px 12px; border-top: 1px solid rgba(255,255,255,0.08); }
  .si-btn {
    padding: 5px 10px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: rgba(255,255,255,0.04);
    color: inherit;
    font-size: 12px;
    cursor: pointer;
  }
  .si-btn:hover { background: rgba(255,255,255,0.08); }
</style>
</head>
<body>
<div id="app">
  <div id="site-info" role="dialog" aria-label="Site security information"></div>
  <div id="toolbar">
    <button id="back" title="Back" aria-label="Go back" disabled>
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <button id="forward" title="Forward" aria-label="Go forward" disabled>
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>
    </button>
    <button id="reload" title="Reload" aria-label="Reload">
      <svg id="reload-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M3 12a9 9 0 0115-6.7L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 01-15 6.7L3 16"/><path d="M3 21v-5h5"/>
      </svg>
      <svg id="stop-icon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none"><rect x="6" y="6" width="12" height="12" rx="1"/></svg>
    </button>
    <div id="url-wrap">
      <button type="button" id="sec" title="Connection" aria-label="Connection security">
        <svg id="sec-lock" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none">
          <rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/>
        </svg>
        <svg id="sec-warn" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none">
          <path d="M12 3l10 18H2L12 3z"/><path d="M12 10v4"/><circle cx="12" cy="17" r="0.8" fill="currentColor"/>
        </svg>
        <svg id="sec-neutral" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="9"/>
        </svg>
      </button>
      <input id="url" type="text" spellcheck="false" autocomplete="off" placeholder="Search or enter address" aria-label="Address bar" aria-autocomplete="list" aria-controls="suggest" />
    </div>
    <button id="home" title="Home" aria-label="Home">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10.5L12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
    </button>
    <button id="settings" title="Browser settings" aria-label="Browser settings">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/>
      </svg>
    </button>
  </div>
  <div id="progress"></div>
  <div id="content">
    <div id="notice">Connecting to the browser pane…</div>
  </div>
  <div id="suggest" role="listbox" aria-label="History suggestions"></div>
</div>
<script>
"use strict";

const CHANNEL = "uefn-plugin-ui";
const HOMEPAGE_DEFAULT = "https://uefnducky.org";
const HOMEPAGE_LEGACY = "https://duckduckgo.com";
const HISTORY_MAX = 200;
const SUGGEST_MAX = 8;

let homepage = HOMEPAGE_DEFAULT;
let searchEngine = "duckduckgo";
let searchCustom = "";
let historyCache = [];
let suggestItems = [];
let suggestIndex = -1;
let suggestOpen = false;
let uiCovered = false;
let suppressBlurNav = false;

function isAppLoopbackUrl(url) {
  if (!url) return false;
  if (url.includes("/plugin-ui/")) return true;
  try {
    const u = new URL(url);
    const h = (u.hostname || "").toLowerCase();
    return h === "127.0.0.1" || h === "localhost" || h === "::1";
  } catch (_) {
    return false;
  }
}

const pending = new Map();
window.addEventListener("message", (ev) => {
  const d = ev.data;
  if (!d || d.channel !== CHANNEL) return;
  if (d.id && pending.has(d.id)) {
    const { resolve, reject } = pending.get(d.id);
    pending.delete(d.id);
    if (d.ok) resolve(d.result);
    else reject(new Error(d.error || "bridge error"));
    return;
  }
  if (d.event && d.event.type === "browser_pane_state") onPaneState(d.event);
});

function call(method, params = {}) {
  const id = (crypto.randomUUID && crypto.randomUUID()) || String(Math.random());
  return new Promise((resolve, reject) => {
    pending.set(id, { resolve, reject });
    parent.postMessage({ channel: CHANNEL, id, method, params }, "*");
    setTimeout(() => {
      if (pending.has(id)) {
        pending.delete(id);
        reject(new Error("bridge timeout"));
      }
    }, 6000);
  });
}

const els = {
  app: document.getElementById("app"),
  back: document.getElementById("back"),
  forward: document.getElementById("forward"),
  reload: document.getElementById("reload"),
  reloadIcon: document.getElementById("reload-icon"),
  stopIcon: document.getElementById("stop-icon"),
  urlWrap: document.getElementById("url-wrap"),
  url: document.getElementById("url"),
  sec: document.getElementById("sec"),
  secLock: document.getElementById("sec-lock"),
  secWarn: document.getElementById("sec-warn"),
  secNeutral: document.getElementById("sec-neutral"),
  suggest: document.getElementById("suggest"),
  siteInfo: document.getElementById("site-info"),
  home: document.getElementById("home"),
  settings: document.getElementById("settings"),
  progress: document.getElementById("progress"),
  content: document.getElementById("content"),
  notice: document.getElementById("notice"),
};

let currentUrl = "";
let loading = false;
let urlFocused = false;
let siteInfoOpen = false;
let lastConnection = "neutral";

function setUiCover(on) {
  // Site-info only. Never leave cover stuck — always resync bounds after.
  uiCovered = !!on;
  call("browser.ui_cover", { cover: uiCovered }).catch(() => {});
  lastRectKey = "";
  reportBounds();
}

function securityFor(url, connection) {
  if (connection === "cert_error") return "cert_error";
  if (connection === "secure" || connection === "not_secure" || connection === "neutral") {
    if (connection === "not_secure") return "insecure";
    return connection;
  }
  const u = (url || "").trim();
  if (!u || u === "about:blank") return "neutral";
  if (/^https:\/\//i.test(u)) return "secure";
  if (/^http:\/\//i.test(u)) return "insecure";
  return "neutral";
}

function paintSecurity(url, connection) {
  const mode = securityFor(
    urlFocused ? toNavigable(els.url.value) || url : url,
    urlFocused ? undefined : connection || lastConnection,
  );
  if (!urlFocused && connection) lastConnection = connection;
  const bad = mode === "insecure" || mode === "cert_error";
  els.urlWrap.classList.toggle("is-secure", mode === "secure");
  els.urlWrap.classList.toggle("is-insecure", bad);
  els.sec.classList.toggle("is-secure", mode === "secure");
  els.sec.classList.toggle("is-insecure", bad);
  els.secLock.style.display = mode === "secure" ? "" : "none";
  els.secWarn.style.display = bad ? "" : "none";
  els.secNeutral.style.display = mode === "neutral" ? "" : "none";
  if (mode === "secure") els.sec.title = "Connection is secure — View site information";
  else if (mode === "cert_error") els.sec.title = "Your connection is not private — View details";
  else if (mode === "insecure") els.sec.title = "Not secure — View site information";
  else els.sec.title = "View site information";
}

function closeSiteInfo() {
  if (!siteInfoOpen) return;
  siteInfoOpen = false;
  els.siteInfo.classList.remove("is-open");
  els.siteInfo.innerHTML = "";
  setUiCover(false);
}

function placeSiteInfo() {
  const wrap = els.urlWrap.getBoundingClientRect();
  const app = els.app && els.app.getBoundingClientRect ? els.app.getBoundingClientRect() : { left: 0, top: 0, width: window.innerWidth };
  const pad = 8;
  const width = Math.min(320, Math.max(240, app.width - pad * 2));
  let left = wrap.left - app.left - 4;
  if (left + width > app.width - pad) left = Math.max(pad, app.width - width - pad);
  if (left < pad) left = pad;
  els.siteInfo.style.left = left + "px";
  els.siteInfo.style.width = width + "px";
  els.siteInfo.style.top = "36px";
}

function openSiteInfo() {
  closeSuggest();
  call("browser.site_security", {})
    .then((res) => {
      if (!res || res.ok === false) {
        throw new Error((res && res.error) || "site security unavailable");
      }
      const site = res.site || {};
      const conn = site.connection || lastConnection || "neutral";
      const mode = securityFor(site.url || currentUrl, conn);
      const cookies = Array.isArray(site.cookies) ? site.cookies : [];
      const host = site.host || hostnameOf(site.url || currentUrl) || "—";

      // Compact Chrome-like bubble: identity + cookies. Full engine dump lives in Settings.
      els.siteInfo.innerHTML =
        '<div class="si-head">' +
        '<span class="si-head-icon is-' + mode + '" aria-hidden="true">' +
        (mode === "secure"
          ? '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg>'
          : '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l10 18H2L12 3z"/><path d="M12 10v4"/><circle cx="12" cy="17" r="0.8" fill="currentColor"/></svg>') +
        "</span>" +
        "<div><h2></h2><p></p></div>" +
        '<button type="button" class="si-close" aria-label="Close">×</button></div>' +
        '<div class="si-section">' +
        '<div class="si-row"><span>Host</span><strong id="si-host"></strong></div>' +
        '<div class="si-row"><span>Certificate</span><strong id="si-cert"></strong></div>' +
        "</div>" +
        '<div class="si-section"><h3>Cookies</h3>' +
        '<div class="si-row"><span>In use</span><strong id="si-cc"></strong></div>' +
        '<div class="si-cookies" id="si-cookies"></div></div>' +
        '<div class="si-actions">' +
        '<button type="button" class="si-btn" id="si-settings">Site settings</button>' +
        '<button type="button" class="si-btn" id="si-done">Done</button></div>';

      els.siteInfo.querySelector("h2").textContent = site.headline || "Connection";
      els.siteInfo.querySelector("p").textContent = site.detail || "";
      els.siteInfo.querySelector("#si-host").textContent = host;
      els.siteInfo.querySelector("#si-cert").textContent = site.certificate || "—";
      els.siteInfo.querySelector("#si-cc").textContent = String(site.cookie_count ?? cookies.length);

      const cookieBox = els.siteInfo.querySelector("#si-cookies");
      if (!cookies.length) {
        cookieBox.innerHTML = '<p class="suggest-empty" style="padding:2px 0;margin:0;font-size:11px">No cookies for this site</p>';
      } else {
        cookies.slice(0, 12).forEach((c) => {
          const row = document.createElement("div");
          row.className = "si-cookie";
          row.innerHTML = "<code></code><em></em>";
          row.querySelector("code").textContent = c.name || "(unnamed)";
          row.querySelector("em").textContent = c.domain || "";
          cookieBox.appendChild(row);
        });
      }

      els.siteInfo.querySelector(".si-close").addEventListener("click", closeSiteInfo);
      els.siteInfo.querySelector("#si-done").addEventListener("click", closeSiteInfo);
      els.siteInfo.querySelector("#si-settings").addEventListener("click", () => {
        closeSiteInfo();
        call("browser.open_settings", {}).catch(() => {});
      });

      placeSiteInfo();
      siteInfoOpen = true;
      els.siteInfo.classList.add("is-open");
      setUiCover(true);
    })
    .catch((err) => {
      els.siteInfo.innerHTML =
        '<div class="si-head"><div><h2>Site information unavailable</h2><p></p></div>' +
        '<button type="button" class="si-close" aria-label="Close">×</button></div>';
      els.siteInfo.querySelector("p").textContent = String(err && err.message ? err.message : err);
      els.siteInfo.querySelector(".si-close").addEventListener("click", closeSiteInfo);
      placeSiteInfo();
      siteInfoOpen = true;
      els.siteInfo.classList.add("is-open");
      setUiCover(true);
    });
}

function onPaneState(s) {
  currentUrl = s.url || "";
  loading = !!s.loading;
  els.back.disabled = !s.can_back;
  els.forward.disabled = !s.can_forward;
  els.progress.classList.toggle("loading", loading);
  els.reloadIcon.style.display = loading ? "none" : "";
  els.stopIcon.style.display = loading ? "" : "none";
  els.reload.title = loading ? "Stop" : "Reload";
  if (s.connection) lastConnection = s.connection;
  if (!urlFocused) {
    els.url.value = currentUrl;
    paintSecurity(currentUrl, s.connection);
  }
  if (s.failed) {
    els.notice.textContent = s.failed;
    els.notice.classList.add("failed");
    els.notice.classList.remove("hidden");
  } else {
    els.notice.classList.remove("failed");
    if (s.ready) els.notice.classList.add("hidden");
  }
  if (currentUrl && currentUrl !== "about:blank" && !isAppLoopbackUrl(currentUrl)) {
    call("prefs.set", { id: "lastUrl", value: currentUrl }).catch(() => {});
    pushHistory(currentUrl, s.title || "");
  }
}

function pushHistory(url, title) {
  call("prefs.get", { id: "history" })
    .then((res) => {
      let list = Array.isArray(res && res.value) ? res.value.slice() : [];
      list = list.filter((h) => h && h.url !== url);
      list.unshift({ url, title: title || url, at: Date.now() });
      if (list.length > HISTORY_MAX) list = list.slice(0, HISTORY_MAX);
      historyCache = list;
      return call("prefs.set", { id: "history", value: list });
    })
    .catch(() => {});
}

function refreshHistoryCache() {
  return call("prefs.get", { id: "history" })
    .then((res) => {
      historyCache = Array.isArray(res && res.value) ? res.value : [];
    })
    .catch(() => {
      historyCache = [];
    });
}

function searchUrl(query) {
  const q = encodeURIComponent(query);
  if (searchEngine === "google") return "https://www.google.com/search?q=" + q;
  if (searchEngine === "bing") return "https://www.bing.com/search?q=" + q;
  if (searchEngine === "custom" && searchCustom.includes("%s")) {
    return searchCustom.replace("%s", q);
  }
  return "https://duckduckgo.com/?q=" + q;
}

function toNavigable(input) {
  const t = (input || "").trim();
  if (!t) return "";
  if (/^(https?:\/\/|about:)/i.test(t)) return t;
  if (!/\s/.test(t) && t.includes(".")) return "https://" + t;
  return searchUrl(t);
}

function hostnameOf(url) {
  try {
    return new URL(url).hostname.replace(/^www\./, "");
  } catch (_) {
    return url;
  }
}

function filterHistory(query) {
  const q = (query || "").trim().toLowerCase();
  if (!q) return historyCache.slice(0, SUGGEST_MAX);
  const scored = [];
  for (const h of historyCache) {
    if (!h || !h.url) continue;
    const url = String(h.url).toLowerCase();
    const title = String(h.title || "").toLowerCase();
    const host = hostnameOf(h.url).toLowerCase();
    let score = 0;
    if (host.startsWith(q)) score = 100;
    else if (host.includes(q)) score = 80;
    else if (url.includes(q)) score = 60;
    else if (title.includes(q)) score = 40;
    else continue;
    scored.push({ h, score });
  }
  scored.sort((a, b) => b.score - a.score || (b.h.at || 0) - (a.h.at || 0));
  return scored.slice(0, SUGGEST_MAX).map((x) => x.h);
}

function placeSuggest() {
  const wrap = els.urlWrap.getBoundingClientRect();
  const app = els.app.getBoundingClientRect();
  const left = Math.max(8, wrap.left - app.left);
  const width = Math.min(Math.max(wrap.width, 220), app.width - left - 8);
  els.suggest.style.left = left + "px";
  els.suggest.style.top = wrap.bottom - app.top + 4 + "px";
  els.suggest.style.width = width + "px";
}

function closeSuggest() {
  suggestOpen = false;
  suggestIndex = -1;
  suggestItems = [];
  els.suggest.classList.remove("is-open");
  els.suggest.innerHTML = "";
}

function renderSuggest() {
  els.suggest.innerHTML = "";
  if (!suggestItems.length) {
    const p = document.createElement("p");
    p.className = "suggest-empty";
    p.textContent = historyCache.length ? "No matching history" : "No history yet — visit sites to see suggestions";
    els.suggest.appendChild(p);
  } else {
    suggestItems.forEach((h, i) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "suggest-item" + (i === suggestIndex ? " is-active" : "");
      btn.setAttribute("role", "option");
      btn.innerHTML = '<span class="suggest-title"></span><span class="suggest-url"></span>';
      btn.querySelector(".suggest-title").textContent = h.title && h.title !== h.url ? h.title : hostnameOf(h.url);
      btn.querySelector(".suggest-url").textContent = h.url;
      btn.addEventListener("mousedown", (e) => {
        e.preventDefault();
        suppressBlurNav = true;
        navigateTo(h.url);
        closeSuggest();
        els.url.blur();
      });
      els.suggest.appendChild(btn);
    });
  }
  placeSuggest();
  els.suggest.classList.add("is-open");
  suggestOpen = true;
}

function openSuggestFor(query) {
  suggestItems = filterHistory(query);
  suggestIndex = suggestItems.length ? 0 : -1;
  renderSuggest();
}

function navigateTo(url) {
  const target = toNavigable(url);
  if (!target) return;
  closeSuggest();
  if (uiCovered) setUiCover(false);
  els.url.value = target;
  currentUrl = target;
  paintSecurity(target);
  call("browser.navigate", { url: target })
    .then((res) => {
      if (res && res.ok === false) {
        els.notice.textContent = res.error || "Navigation failed";
        els.notice.classList.add("failed");
        els.notice.classList.remove("hidden");
      }
    })
    .catch((err) => {
      els.notice.textContent = String(err && err.message ? err.message : err);
      els.notice.classList.add("failed");
      els.notice.classList.remove("hidden");
    });
  lastRectKey = "";
  reportBounds();
}

els.back.addEventListener("click", () => call("browser.command", { command: "back" }).catch(() => {}));
els.forward.addEventListener("click", () => call("browser.command", { command: "forward" }).catch(() => {}));
els.reload.addEventListener("click", () =>
  call("browser.command", { command: loading ? "stop" : "reload" }).catch(() => {}),
);
els.home.addEventListener("click", () => navigateTo(homepage));
els.settings.addEventListener("click", () => {
  closeSuggest();
  closeSiteInfo();
  call("browser.open_settings", {}).catch(() => {});
});
els.sec.addEventListener("click", () => {
  if (siteInfoOpen) closeSiteInfo();
  else openSiteInfo();
});

els.url.addEventListener("focus", () => {
  urlFocused = true;
  // Drop the native pane immediately so WebView2 cannot yank focus mid-edit.
  lastRectKey = "";
  reportBounds();
  els.url.select();
  refreshHistoryCache().then(() => openSuggestFor(els.url.value));
});
els.url.addEventListener("blur", () => {
  setTimeout(() => {
    if (suppressBlurNav) {
      suppressBlurNav = false;
      urlFocused = false;
      lastRectKey = "";
      reportBounds();
      return;
    }
    urlFocused = false;
    closeSuggest();
    els.url.value = currentUrl;
    paintSecurity(currentUrl, lastConnection);
    // Restore the page under the toolbar; leave focus on the chrome, not the page.
    lastRectKey = "";
    reportBounds();
    try {
      els.home.focus({ preventScroll: true });
      els.home.blur();
    } catch (_) { /* ignore */ }
  }, 120);
});
els.url.addEventListener("input", () => {
  paintSecurity(els.url.value);
  openSuggestFor(els.url.value);
});
els.url.addEventListener("keydown", (e) => {
  if (e.key === "ArrowDown" && suggestOpen && suggestItems.length) {
    e.preventDefault();
    suggestIndex = (suggestIndex + 1) % suggestItems.length;
    renderSuggest();
    return;
  }
  if (e.key === "ArrowUp" && suggestOpen && suggestItems.length) {
    e.preventDefault();
    suggestIndex = (suggestIndex - 1 + suggestItems.length) % suggestItems.length;
    renderSuggest();
    return;
  }
  if (e.key === "Enter") {
    e.preventDefault();
    if (suggestOpen && suggestIndex >= 0 && suggestItems[suggestIndex]) {
      navigateTo(suggestItems[suggestIndex].url);
    } else {
      navigateTo(els.url.value);
    }
    els.url.blur();
    return;
  }
  if (e.key === "Escape") {
    closeSuggest();
    els.url.value = currentUrl;
    els.url.blur();
  }
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && siteInfoOpen) {
    e.preventDefault();
    closeSiteInfo();
    return;
  }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "l") {
    e.preventDefault();
    els.url.focus();
  }
});

let lastRectKey = "";
function reportBounds() {
  const r = els.content.getBoundingClientRect();
  // Hide native WebView2 while the address bar is focused (or site-info is open).
  // Otherwise the OS pane sits on top of HTML suggestions and steals focus/clicks —
  // which is what made the URL bar feel "broken". Prefer bounds.visible over
  // ui_cover refcount (that path used to stick and leave every pane black).
  const visible = !siteInfoOpen && !urlFocused;
  const key = [r.x, r.y, r.width, r.height, visible ? 1 : 0].map((n) => Math.round(n * 10)).join(",");
  if (key === lastRectKey) return;
  // Only lock the key after a successful pin — a failed first call used to
  // permanently skip retries at the same size (YouTube in URL, black content).
  lastRectKey = key;
  call("browser.bounds", {
    x: r.x,
    y: r.y,
    width: r.width,
    height: r.height,
    visible,
  })
    .then((res) => {
      if (!res || res.ok === false) lastRectKey = "";
    })
    .catch(() => {
      lastRectKey = "";
    });
}
new ResizeObserver(reportBounds).observe(els.content);
window.addEventListener("resize", reportBounds);
setInterval(reportBounds, 250);

async function loadPrefs() {
  try {
    const home = await call("prefs.get", { id: "homepage" });
    if (home && typeof home.value === "string" && home.value.trim()) {
      homepage = home.value.trim().replace(/\/+$/, "") || HOMEPAGE_DEFAULT;
      // Ship moved off DuckDuckGo — rewrite the old default once so Home isn't stuck.
      if (homepage === HOMEPAGE_LEGACY || homepage === "http://duckduckgo.com") {
        homepage = HOMEPAGE_DEFAULT;
        call("prefs.set", { id: "homepage", value: homepage }).catch(() => {});
      }
    }
  } catch (_) { /* first run */ }
  try {
    const se = await call("prefs.get", { id: "searchEngine" });
    if (se && typeof se.value === "string" && se.value) searchEngine = se.value;
  } catch (_) { /* first run */ }
  try {
    const sc = await call("prefs.get", { id: "searchCustom" });
    if (sc && typeof sc.value === "string") searchCustom = sc.value;
  } catch (_) { /* first run */ }
  await refreshHistoryCache();
}

async function boot(attempt) {
  try {
    closeSuggest();
    closeSiteInfo();
    // Lift any stuck cover from a previous tab session.
    if (uiCovered) setUiCover(false);
    await loadPrefs();
    // Remount: reconnect with "" so we keep the existing page. New pane: homepage.
    let startUrl = homepage || HOMEPAGE_DEFAULT;
    try {
      const prev = await call("browser.state", {});
      if (prev && prev.ok !== false && (prev.url || prev.ready)) startUrl = "";
    } catch (_) { /* first open */ }
    const state = await call("browser.open", { url: startUrl });
    if (state && state.ok === false) throw new Error(state.error || "open failed");
    lastRectKey = "";
    reportBounds();
    // Second tick after layout — first rect is often 0×0 and left the pane invisible.
    requestAnimationFrame(() => {
      lastRectKey = "";
      reportBounds();
      setTimeout(() => {
        lastRectKey = "";
        reportBounds();
      }, 100);
    });
    if (state) onPaneState(state);
  } catch (err) {
    if (attempt < 20) {
      setTimeout(() => boot(attempt + 1), 500);
    } else {
      els.notice.textContent =
        "Browser pane unavailable — update UEFN Ducky to a build with native browser panes. (" +
        (err && err.message ? err.message : "no bridge") + ")";
      els.notice.classList.remove("hidden");
    }
  }
}
boot(0);
</script>
</body>
</html>
